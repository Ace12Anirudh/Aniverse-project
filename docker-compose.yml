

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: aniverse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aniverse
      MYSQL_USER: aniverse_user
      MYSQL_PASSWORD: aniverse_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aniverse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aniverse-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://aniverse_user:aniverse_password@mysql:3306/aniverse
      - SECRET_KEY=your-secret-key-for-development
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aniverse-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aniverse-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aniverse-network
    command: npm run dev

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: aniverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aniverse-network
    command: redis-server --appendonly yes

  # Prometheus (for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: aniverse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - aniverse-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana (for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: aniverse-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - aniverse-network
    depends_on:
      - prometheus

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  aniverse-network:
    driver: bridge
