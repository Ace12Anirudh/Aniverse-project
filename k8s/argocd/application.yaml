apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aniverse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/AniVerse.git # REPLACE WITH YOUR REPO URL
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: aniverse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
