apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: aniverse
data:
  DEBUG: "True"
  CORS_ORIGINS: "http://localhost:3000,http://aniverse.example.com" # Update with real domain
  AWS_REGION: us-east-1
  PROCESSED_BUCKET: aniverse-processed-media-dev # UPDATE THIS
  CLOUDFRONT_DOMAIN: d12345abcdefg.cloudfront.net # UPDATE THIS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aniverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/aniverse-backend:latest # REPLACE WITH YOUR ECR URI
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: mysql-secrets
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/$(MYSQL_DATABASE)"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SECRET_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aniverse
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: aniverse
type: Opaque
stringData:
  SECRET_KEY: "change-this-to-a-secure-random-string"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: aniverse
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
